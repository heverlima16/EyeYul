<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:#fbf9f6;font-family:var(--font-sans);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Toggle, Slider, WeekdaySelector } = window.EyeYul_491522;
function Demo() {
  const [on, setOn] = React.useState(true);
  const [off, setOff] = React.useState(false);
  const [val, setVal] = React.useState(20);
  const [days, setDays] = React.useState([1,2,3,4,5]);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:18, maxWidth:640}}>
      <div style={{display:'flex', gap:24, alignItems:'center'}}>
        <Toggle checked={on} onChange={setOn} />
        <Toggle checked={off} onChange={setOff} />
        <Toggle checked={true} size="sm" />
        <Toggle checked={false} disabled />
      </div>
      <Slider label="Tiempo de Trabajo" value={val} min={5} max={90} step={5} unit=" minutos" onChange={setVal} />
      <WeekdaySelector selected={days} onToggle={(d) => setDays(days.includes(d) ? days.filter(x=>x!==d) : [...days, d])} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
