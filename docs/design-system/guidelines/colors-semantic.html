<!-- @dsCard group="Colors" viewport="700x120" name="Semantic Accents" subtitle="Amber, emerald, blue, purple — one meaning each" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;display:flex;gap:14px;}
.chip{flex:1;border-radius:14px;padding:12px;color:#fff;font-size:11px;font-weight:600;}
.lbl{font:600 9px/1 var(--font-mono);opacity:.85;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;}
</style></head>
<body>
<div class="chip" style="background:var(--color-amber-500)"><span class="lbl">Amber</span>Posture / warning</div>
<div class="chip" style="background:var(--color-emerald-500)"><span class="lbl">Emerald</span>Success / "libre"</div>
<div class="chip" style="background:var(--color-blue-500)"><span class="lbl">Blue</span>AFK / inactivity</div>
<div class="chip" style="background:var(--color-purple-500)"><span class="lbl">Purple</span>Focus mode</div>
</body></html>
