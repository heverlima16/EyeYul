<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);background:#fff;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{height:70px;border-radius:12px;border:1px solid #e5e7eb;display:flex;align-items:flex-end;padding:6px;font:600 9px/1.3 var(--font-mono);}
</style></head>
<body>
<div class="grid">
<div class="sw" style="background:var(--color-light-bg)">bg<br>#fbf9f6</div>
<div class="sw" style="background:var(--color-light-bg-alt)">bg-alt<br>#f5f1ea</div>
<div class="sw" style="background:var(--color-light-surface)">surface<br>#ffffff</div>
<div class="sw" style="background:var(--color-light-surface-2)">sidebar<br>#f4f2ee</div>
<div class="sw" style="background:var(--color-light-border);color:#333">border<br>#e5e7eb</div>
</div>
</body></html>
