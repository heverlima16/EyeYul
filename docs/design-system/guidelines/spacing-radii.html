<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-mono);display:flex;gap:14px;align-items:flex-end;}
.box{background:#f5f1ea;border:1px solid #e5e7eb;width:64px;height:64px;display:flex;align-items:flex-end;justify-content:center;font-size:9px;color:#6b7280;padding-bottom:6px;}
</style></head>
<body>
<div class="box" style="border-radius:8px">sm 8</div>
<div class="box" style="border-radius:12px">md 12</div>
<div class="box" style="border-radius:16px">lg 16</div>
<div class="box" style="border-radius:24px">xl 24</div>
<div class="box" style="border-radius:32px">2xl 32</div>
<div class="box" style="border-radius:9999px">full</div>
</body></html>
