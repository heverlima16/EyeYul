<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans);background:#14120e;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{height:70px;border-radius:12px;border:1px solid #373127;display:flex;align-items:flex-end;padding:6px;font:600 9px/1.3 var(--font-mono);color:#ece5da;}
</style></head>
<body>
<div class="grid">
<div class="sw" style="background:var(--color-dark-bg)">bg<br>#14120e</div>
<div class="sw" style="background:var(--color-dark-surface)">surface<br>#1d1a15</div>
<div class="sw" style="background:var(--color-dark-surface-2)">surface-2<br>#24211a</div>
<div class="sw" style="background:var(--color-dark-surface-3)">surface-3<br>#13110e</div>
<div class="sw" style="background:var(--color-dark-border-2)">border<br>#373127</div>
</div>
</body></html>
